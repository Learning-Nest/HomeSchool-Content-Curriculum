name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - run: python tools/validate.py
      - run: python tools/build_bundle.py --version ci-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: dist/bundle.json
